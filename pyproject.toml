[project]
name = "sirina"
version = "0.1.0"
description = "Reusable Sirina TTS and STT components"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "numba>=0.61.0",
    "numpy>=1.26",
    "onnxruntime>=1.16.0",
    "pydantic>=2.10.6",
    "pyyaml>=6.0.2",
    "rich>=14.0.0",
    "sounddevice>=0.5.1",
    "soundfile>=0.13.0",
    "threadpoolctl>=3.0.0",
]

[project.optional-dependencies]
cuda = ["onnxruntime-gpu>=1.16.0"]
dev = ["pytest", "ruff"]

[project.scripts]
sirina = "sirina.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sirina"]
include = ["src/sirina/assets/**/*"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["__pycache__", ".venv", "build", "dist"]
